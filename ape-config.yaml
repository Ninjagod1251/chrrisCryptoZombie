name: cryptozombies

plugins:
  - name: solidity
  - name: hardhat

solidity:
  version: 0.8.31

compilers:
  solidity:
    versions:
      - 0.8.31

contracts_folder: contracts

test:
  folder: test
  isolation: true

networks:
  ethereum:
    local:
      default_provider: test
    local_hardhat:
      default_provider: hardhat
    sepolia:
      default_provider: node

node:
  ethereum:
    sepolia:
      uri: https://ethereum-sepolia-rpc.publicnode.com